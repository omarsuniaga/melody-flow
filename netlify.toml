[build]
  command = "npm run build"
  publish = "dist"
  base = "/"
  NPM_FLAGS = "--legacy-peer-deps --no-optional"
  # ...existing configuration...

[build.environment]
  NODE_VERSION = "18.18.0"
  # Firebase Web config values are public by design (not secret credentials);
  # access is protected by Firebase Security Rules + API key restrictions.
  # Prevents Netlify's secrets scanner from false-positively blocking the build
  # because these VITE_ vars get inlined into the client bundle.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_VAPIDKEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimización de caché
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Cross-Origin-Resource-Policy = "cross-origin"

[functions]
directory = "netlify/functions"
